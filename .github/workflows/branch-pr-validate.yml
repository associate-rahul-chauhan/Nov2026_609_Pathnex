
name: Validate Branch Files custom actions

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-files:
    name: Check day and week files
    runs-on: ubuntu-latest

    # Skip validation if source branch contains 'patch'
    if: >-
      !contains(
        github.head_ref || github.ref_name,
        'patch'
      )

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate required files
        shell: bash
        run: |
          files="$(git ls-files)"

          if ! printf '%s\n' "$files" | grep -Eq '(^|/)day[^/]*$'; then
            echo "ERROR: No file starting with 'day' found."
            exit 1
          fi


          echo "SUCCESS: Both day* and week* files exist."

  require-approval:
    name: Require approval for non-patch PR
    runs-on: ubuntu-latest

    # Run only for non-patch pull requests
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.head_ref, 'patch')

    steps:
      - name: Check reviewer approval
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner,
                repo,
                pull_number
              }
            );

            // Keep the latest submitted review from each reviewer
            const latestReviews = new Map();

            for (const review of reviews) {
              if (!review.submitted_at || !review.user) continue;

              const username = review.user.login;
              const existing = latestReviews.get(username);

              if (
                !existing ||
                new Date(review.submitted_at) >
                new Date(existing.submitted_at)
              ) {
                latestReviews.set(username, review);
              }
            }

            // At least one latest review must be APPROVED
            const approved = [...latestReviews.values()]
              .filter(review => review.state === 'APPROVED');

            if (approved.length < 1) {
              core.setFailed(
                'At least one approving review is required.'
              );
            } else {
              core.info(
                `Approval found from: ${approved
                  .map(review => review.user.login)
                  .join(', ')}`
              );
            }
