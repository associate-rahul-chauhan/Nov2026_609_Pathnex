jobs:
  validate-files:
    name: Check day and week files
    runs-on: ubuntu-latest

    # Skip validation when the source branch is named patch
    if: >-
      !contains(
        github.head_ref || github.ref_name,
        'patch'
      )

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate required files
        shell: bash
        run: |
          files="$(git ls-files)"

          if ! printf '%s\n' "$files" | grep -Eq '(^|/)day[^/]*$'; then
            echo "ERROR: No file starting with 'day' found."
            exit 1
          fi

          if ! printf '%s\n' "$files" | grep -Eq '(^|/)week[^/]*$'; then
            echo "ERROR: No file starting with 'week' found."
            exit 1
          fi

          echo "SUCCESS: Both day* and week* files exist."
