apiVersion: v1
kind: Pod
metadata:
  name: node-affinity-pod
  labels:
    name: ssd
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disktype
                operator: In
                values:
                  - ssd
  containers:
    - name: busybox
      image: busybox
      command: ["sleep", "300"]
