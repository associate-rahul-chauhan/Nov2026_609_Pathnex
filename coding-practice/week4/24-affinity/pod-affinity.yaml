apiVersion: v1
kind: Pod
metadata:
  name: web-pod-required
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:   # HARD rule
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - cache
        topologyKey: kubernetes.io/hostname             # same NODE par
  containers:
  - name: nginx
    image: nginx
    ports:
    - containerPort: 80