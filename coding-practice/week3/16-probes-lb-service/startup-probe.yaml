apiVersion: v1
kind: Pod
metadata:
  name: startup-pod
spec:
  containers:
    - name: main-app
      image: busybox
      command: ["sh", "-c", "sleep 20; touch /tmp/healthy; sleep 3600"] # ek file create hogi after 20 second aur ye image 3600 min tak chalegi
      startupProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        periodSeconds: 2
        failureThreshold: 3
