apiVersion: v1
kind: Pod
metadata:
  name: correct-demo-2
spec:
  containers:
    - name: main-app-2
      image: nginx
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 1

