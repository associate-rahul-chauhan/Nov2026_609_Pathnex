apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-db
  spec:
    serviceName: "mysql-headless"
    replicas: 3
     selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
      spec:
        containers:
        - name: mysql
          image: mysql:5.7
          ports:
          - containerPort: 3306
          volumeMounts:
          - name: mysql-persistent-storage
            mountPath: /var/lib/mysql
    volumeClaimTemplates:
    - metadata:
        name: mysql-persistent-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
